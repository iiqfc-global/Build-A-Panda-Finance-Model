<script>
    // 初始固定资本
    const CAPEX = 14527; 
    
    // 零售固定定价
    const PRICE_BASIC = 89.0;
    const PRICE_LUXURY = 169.0;

    // 折叠面板控制
    function toggleBOM() {
        const panel = document.getElementById('bom-panel');
        const icon = document.getElementById('bom-icon');
        if (panel.classList.contains('active')) {
            panel.classList.remove('active'); icon.innerText = '▼';
        } else {
            panel.classList.add('active'); icon.innerText = '▲';
        }
    }

    // 格式化函数
    const fmtC = (n) => '¥ ' + Math.round(n).toLocaleString('zh-CN');
    
    // 核心算法
    function updateModel() {
        // 更新滑块前端文本显示
        document.getElementById('val-traffic-wd').innerText = document.getElementById('traffic-wd').value + ' 人/天';
        document.getElementById('val-traffic-we').innerText = document.getElementById('traffic-we').value + ' 人/天';
        document.getElementById('val-conversion').innerText = document.getElementById('conversion').value + ' %';
        document.getElementById('val-luxury').innerText = document.getElementById('luxury').value + ' %';
        document.getElementById('val-target').innerText = parseInt(document.getElementById('target-gmv').value).toLocaleString() + ' 元';
        document.getElementById('val-comm-base').innerText = document.getElementById('comm-base').value;
        document.getElementById('val-comm-high').innerText = document.getElementById('comm-high').value;
        document.getElementById('val-opex').innerText = document.getElementById('opex').value + ' 元/天';

        // 1. 获取动态 BOM 成本
        const bSkin = parseFloat(document.getElementById('bom-skin').value);
        const bCotton = parseFloat(document.getElementById('bom-cotton').value);
        const bVoice = parseFloat(document.getElementById('bom-voice').value);
        const bHeart1 = parseFloat(document.getElementById('bom-heart1').value);
        const bHeart2 = parseFloat(document.getElementById('bom-heart2').value);
        const bBox = parseFloat(document.getElementById('bom-box').value);
        const bCloth = parseFloat(document.getElementById('bom-cloth').value);
        const bAcc = parseFloat(document.getElementById('bom-acc').value);

        const costBasic = bSkin + bCotton + bVoice + bHeart1 + bBox;
        const costLuxury = costBasic - bHeart1 + bHeart2 + bCloth + bAcc;

        // 2. 获取运营变量
        const tWd = parseFloat(document.getElementById('traffic-wd').value);
        const tWe = parseFloat(document.getElementById('traffic-we').value);
        const conv = parseFloat(document.getElementById('conversion').value) / 100;
        const rLux = parseFloat(document.getElementById('luxury').value) / 100;
        const rBas = 1 - rLux;
        
        const targetGMV = parseFloat(document.getElementById('target-gmv').value);
        const cBase = parseFloat(document.getElementById('comm-base').value) / 100;
        const cHigh = parseFloat(document.getElementById('comm-high').value) / 100;
        const dailyOpex = parseFloat(document.getElementById('opex').value);

        // 3. 订单与加权指标计算
        // 假设每月 22 个工作日，8 个周末/节假日
        const monthlyOrders = ((tWd * 22) + (tWe * 8)) * conv;
        const avgATV = (PRICE_BASIC * rBas) + (PRICE_LUXURY * rLux);
        const avgBOM = (costBasic * rBas) + (costLuxury * rLux);
        
        const monthlyGMV = monthlyOrders * avgATV;
        const monthlyBOMTotal = monthlyOrders * avgBOM;
        const monthlyOpexTotal = dailyOpex * 30;

        // 4. 阶梯扣点博弈模型
        let mallRev = 0;
        let commStatus = "";
        if (monthlyGMV <= targetGMV) {
            mallRev = monthlyGMV * cBase;
            commStatus = `未达降点线，全额按保底 ${document.getElementById('comm-base').value}% 抽成`;
        } else {
            const basePart = targetGMV * cBase;
            const highPart = (monthlyGMV - targetGMV) * cHigh;
            mallRev = basePart + highPart;
            commStatus = `🎉 突破 ${document.getElementById('target-gmv').value} 元！超额部分已按 ${document.getElementById('comm-high').value}% 让利降扣`;
        }

        // 5. 卖家净利润生死线
        const partnerNet = monthlyGMV - monthlyBOMTotal - mallRev - monthlyOpexTotal;
        
        // 6. 投资回报率
        const dailyNet = partnerNet / 30;
        let roi = dailyNet > 0 ? Math.ceil(CAPEX / dailyNet) : Infinity;

        // 7. 渲染 DOM 输出
        document.getElementById('out-orders').innerText = Math.round(monthlyOrders) + ' 单';
        document.getElementById('out-atv').innerText = '¥ ' + avgATV.toFixed(1);
        document.getElementById('out-mall-rev').innerText = fmtC(mallRev);
        document.getElementById('out-comm-status').innerText = commStatus;
        
        const elPartnerNet = document.getElementById('out-partner-net');
        elPartnerNet.innerText = fmtC(partnerNet);
        elPartnerNet.style.color = partnerNet < 0 ? '#e74c3c' : 'var(--primary)';

        const elRoi = document.getElementById('out-roi');
        if (roi === Infinity || roi < 0) {
            elRoi.innerText = '持续亏损';
            elRoi.style.color = '#e74c3c';
        } else {
            elRoi.innerText = roi + ' 天';
            elRoi.style.color = 'var(--accent)';
        }
    }

    // 绑定所有的输入事件
    const inputIds = ['traffic-wd', 'traffic-we', 'conversion', 'luxury', 'target-gmv', 'comm-base', 'comm-high', 'opex', 'bom-skin', 'bom-cotton', 'bom-voice', 'bom-heart1', 'bom-heart2', 'bom-box', 'bom-cloth', 'bom-acc'];
    inputIds.forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            el.addEventListener('input', updateModel);
            el.addEventListener('change', updateModel);
        }
    });

    // 页面加载完毕后进行首次初始化计算
    updateModel();
</script>
